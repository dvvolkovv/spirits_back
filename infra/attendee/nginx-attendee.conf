# Приём звука встреч Meet от Attendee.
#
# Порт свой у каждого задания воркера: один общий порт невозможен, потому что
# каждое задание в @livekit/agents — отдельный процесс, импортирующий модуль
# ещё до получения задания (подробности — в docs/superpowers/plans/
# 2026-09-07-meeting-bridge-meet.md, раздел про дефект плана).
#
# Порт уезжает в путь, а TLS терминирует nginx. Без TLS звук переговоров шёл бы
# между двумя нашими хостами открытым текстом по публичной сети.
#
# ДИАПАЗОН В РЕГУЛЯРКЕ ОБЯЗАТЕЛЕН. Без него `proxy_pass` на $1 — это SSRF на
# любой локальный порт, включая Postgres, Redis и админку LiveKit.
# Диапазон обязан совпадать с ATTENDEE_WS_PORT_MIN/MAX в voice-host/.env.
#
# Шесть портов — потолок одновременных встреч (решение владельца 13.10.2026).
# Прежде был один: Attendee в Celery-режиме держит ботов в общем контейнере,
# где звук разных переговоров может перетекать. Теперь на мосту остался только
# Teams, остальное ведёт свой сервис — по браузеру на встречу, перетекать
# нечему. Подробный разбор — у PORT_MIN/PORT_MAX в voice-host/src/attendee-audio.ts.
#
# Совпадение диапазона с кодом проверяется тестом (attendee-audio.test.ts,
# «диапазон портов и nginx»): расхождение здесь — дыра наружу, и держать его
# на внимательности правящего больше не надо.
location ~ ^/attendee/(814[0-5])$ {
    proxy_pass http://127.0.0.1:$1;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    # Встреча живёт до двух часов (потолок в occupancy.ts), и вебсокет обязан
    # пережить её целиком. Дефолтные 60 секунд обрывали бы звук на первой паузе.
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;

    # Только с хоста Attendee. Ручка не имеет своей авторизации: единственная
    # защита — callId в query, и он не секрет.
    allow ATTENDEE_HOST_IP;
    deny all;
}
