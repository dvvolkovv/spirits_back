# Приём звука встреч на ПРОДЕ — от машины ботов (46.101.255.44).
#
# Отличается от `nginx-attendee.conf` (стенд) одним: здесь НЕТ ограничения по
# адресу. Перед nginx прода стоит ещё один проксирующий узел, все запросы
# приходят с одного адреса (92.53.64.147), а настоящий клиентский он не
# передаёт — 28.09.2026 список разрешённых адресов не пустил собственную
# машину ботов, и звук встречи не поднялся вовсе.
#
# Чем ручка защищена сейчас: одноразовым `callId` в адресе. Воркер ждёт
# соединения ровно под свой идентификатор, чужое отвергает («соединение не для
# нас») и ждёт считанные минуты. Это слабее списка адресов — см. пункт в
# docs/meetings-todo.md о том, чем это заменить.
#
# ДИАПАЗОН В РЕГУЛЯРКЕ ОБЯЗАТЕЛЕН. Без него proxy_pass на $1 — доступ к любому
# локальному порту, включая Postgres, Redis и админку LiveKit. Диапазон обязан
# совпадать с ATTENDEE_WS_PORT_MIN/MAX в voice-host.
location ~ ^/attendee/(8140)$ {
    proxy_pass http://127.0.0.1:$1;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    # Встреча живёт до двух часов, и вебсокет обязан пережить её целиком.
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
}
